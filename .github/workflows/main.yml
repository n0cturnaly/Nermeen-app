name: Build Nermeenly APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o NermeenlyBlogApp_Android_Project.zip
          echo "Project extracted:"
          ls -la NermeenlyBlogApp

      - name: Remove problematic adaptive icon
        run: |
          rm -f NermeenlyBlogApp/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: NermeenlyBlogApp
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "        BUILD ERROR SUMMARY"
          echo "========================================"

          grep -Ei \
            "FAILURE:|error:|Execution failed|Could not|AAPT|resource .* not found|duplicate|Manifest merger failed|java.lang" \
            build.log | tail -100 || true

          echo ""
          echo "========================================"
          echo "        END ERROR SUMMARY"
          echo "========================================"

          exit $BUILD_STATUS

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nermeenly-debug-apk
          path: NermeenlyBlogApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error